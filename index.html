<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="barra-filtros">
      <input type="text" id="busqueda" placeholder="Buscar comida...">
      <select id="filtroCategoria">
        <option value="">Todas las categorías</option>
      </select>
      <select id="filtroProvincia">
        <option value="">Todas las provincias</option>
      </select>
      <button type="button" id="botonAgregar">Agregar comida</button>
      <section class="addFood" id="seccionAgregar">
        <h2>Agregar comida</h2>
        <form id="comidaForm">
          <p>Nombre de la comida:</p>
          <input type="text" id="nombre" placeholder="Nombre" required>
          <p>Categoría:</p>
          <input type="text" id="categoria" placeholder="Categoría" required>
          <p>Provincia de origen:</p>
          <input type="text" id="provincia" placeholder="Provincia" required>
          <p>Ingredientes (separados por comas):</p>
          <input type="text" id="ingredientes" placeholder="Ingredientes" required>
          <br>
          <button type="submit">Agregar comida</button>
        </form>
      </section>
    </header>
    

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     
    <script type="module" src="./main.js"></script>
</body>
</html>
