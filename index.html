<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header class="barra-filtros">
      <div class="fila-filtros">
        <input type="text" id="busqueda" placeholder="Buscar comida...">
        <select id="filtroCategoria">
          <option value="">Todas las categorías</option>
        </select>
        <select id="filtroProvincia">
          <option value="">Todas las provincias</option>
        </select>
      <button type="button" id="botonAgregar">Agregar comida</button>
      </div>
      <section class="addFood" id="seccionAgregar">
        <h2>Agregar comida</h2>
        <form id="comidaForm">
          <p>Nombre de la comida:</p>
          <input type="text" id="nombre" placeholder="Nombre" required>
          <p>Categoría:</p>
          <input type="text" id="categoria" placeholder="Categoría" required>
          <p>Provincia de origen:</p>
          <input type="text" id="provincia" placeholder="Provincia" required>
          <p>Ingredientes:</p>
          <div class="fila-ingrediente">
            <input type="text" id="ingredienteNuevo" placeholder="Ingrediente">
            <button type="button" id="botonIngrediente">Agregar ingrediente</button>
          </div>
          <ul id="listaIngredientes"></ul>
          <br>
          <button type="submit">Agregar comida</button>
        </form>
      </section>
    </header>
    <section class="recetario">
      <h2>¿Qué puedo cocinar?</h2>
      <p>Ingresá los ingredientes disponibles separados por comas.</p>
      <form id="formRecetario">
        <input type="text" id="misIngredientes"
               placeholder="Ingresá ingredientes..." required>
        <button type="submit">Buscar platos</button>
      </form>
    
      <div id="resultadosRecetario"></div>
    </section>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     
    <script type="module" src="./main.js"></script>
</body>
</html>
